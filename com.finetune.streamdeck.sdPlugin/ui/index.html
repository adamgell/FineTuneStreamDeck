<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header><strong>FineTune</strong><span id="status">Connecting…</span></header>
    <p class="hint" id="setup">Enable Local Automation API in FineTune → Settings → General.</p>
    <label>Action<select id="method"></select></label>
    <label
      >Shared target group<select id="group">
        <option value="">This button only</option>
      </select></label
    >
    <p class="hint">XL profile: set each shared target once. All buttons in that group use it.</p>
    <div id="fields"></div>
    <div id="dial">
      <label
        >Dial step<input id="step" type="number" min="0.1" max="10" step="0.1" value="1" /></label
      ><label
        >Push / touch action<select id="push">
          <option value="">Default</option>
          <option value="app.mute.toggle">App mute</option>
          <option value="device.mute.toggle">Device mute</option>
          <option value="app.eq.toggle">EQ enable / bypass</option>
          <option value="ui.popup.toggle">FineTune popup</option>
        </select></label
      >
    </div>
    <div id="result" role="status"></div>
    <div class="buttons">
      <button id="save">Save</button><button id="refresh">Refresh targets</button>
    </div>
    <script src="inspector.js"></script>
  </body>
</html>
